# ARTEX — self-host บนเครื่องส่วนตัว (single machine)
# ----------------------------------------------------------------------------
# ต่างจาก docker-compose.prod.yml: เข้าถึงเฉพาะ localhost, ไม่มี Caddy/TLS,
# เหมาะกับรันคนเดียว/ทีมเล็กบนเครื่อง/VM ของตัวเอง
#
# ใช้งาน:
#   cp deploy/.env.local.example .env   &&  ตั้ง POSTGRES_PASSWORD
#   docker compose -f deploy/docker-compose.local.yml up -d
#   เปิด http://127.0.0.1:8787  (ครั้งแรกไป /setup ตั้งรหัส admin)
#
# อ่าน deploy/SELF-HOST.md ประกอบ (รวม firewall + วิธีอื่น)
# ----------------------------------------------------------------------------

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ตั้ง POSTGRES_PASSWORD ใน .env}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    logging: *default-logging
    # ไม่มี ports: — Postgres เข้าถึงได้เฉพาะภายใน (ปลอดภัยกว่า)

  artex:
    image: autumn27/artex:${ARTEX_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      # LLM: แนะนำตั้งใน UI (System → LLM) แทนการใส่ที่นี่
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
    volumes:
      - ./data:/app/data
      - ./skills:/app/skills
    networks: [backend]
    # ⬇️ ผูกกับ 127.0.0.1 เท่านั้น — คนในวง LAN เข้าไม่ได้
    # :8788 (traffic MITM proxy) ตั้งใจไม่ publish ออกเลย
    ports:
      - "127.0.0.1:8787:8787"
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_RAW", "NET_BIND_SERVICE"]   # ให้ nmap SYN scan ได้ (ตัด NET_RAW ออกได้ถ้าไม่ต้องการ)
    restart: unless-stopped
    logging: *default-logging

networks:
  backend:
    driver: bridge

volumes:
  pgdata:
